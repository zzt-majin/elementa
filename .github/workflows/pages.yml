# 把 repo 原封不動放上 GitHub Pages，不經過 Jekyll（關卡 .md 檔才不會被轉成 html）。
# 使用前：repo 的 Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
name: 發佈網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
