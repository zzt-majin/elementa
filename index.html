<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>故事島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="world/world.css">
<link rel="stylesheet" href="world/quiz.css">
<link rel="stylesheet" href="world/login.css">
<link rel="stylesheet" href="world/cards.css">
<link rel="stylesheet" href="games/quiz-race/race.css">
<!-- three.js（MIT）固定版本，從 cdnjs 載入 -->
<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.182.0/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="world" aria-label="3D 群島"></canvas>
<div id="hud">
  <header class="top">
    <h1 id="site-title">故事島</h1>
    <div id="kids" class="chips" hidden></div>
    <div id="wallet" class="wallet" hidden aria-live="polite"></div>
    <button id="map" class="btn small map-btn" type="button" aria-pressed="false"></button>
    <section id="clock" class="clockbox" aria-label="時鐘與音樂">
      <div class="clock-row">
        <button id="song-prev" class="clock-arrow" type="button"><svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M15 2 L3 10 L15 18 Z"/></svg></button>
        <span id="clock-time" class="clock-time" role="timer">--:--</span>
        <button id="song-next" class="clock-arrow" type="button"><svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M3 2 L15 10 L3 18 Z"/></svg></button>
      </div>
      <p id="song-name" class="song-name" aria-live="polite"></p>
      <button id="mute" class="mute-btn" type="button"></button>
    </section>
  </header>
  <button id="enter" class="enter" type="button" hidden></button>
  <p id="hint" class="hint"></p>
  <p id="errors" class="errors" hidden></p>
  <aside id="panel" hidden><div id="panel-body"></div></aside>
  <p id="loading" class="loading">群島正在浮出海面…</p>
  <button id="start" class="start" type="button" hidden></button>
</div>
<main id="quiz" hidden></main>
<main id="cards" hidden></main>
<main id="game" hidden></main>
<script type="module">
  import { startWorld } from './world/main.js';
  import { createAccount } from './world/account.js';
  // 登入和雲端進度：config/backend.json 的 api 空白時不登入，成績只存在這台裝置
  const account = createAccount({ hudRoot: document.getElementById('hud'), configPath: 'config/' });
  startWorld({
    canvas: document.getElementById('world'),
    hudRoot: document.getElementById('hud'),
    quizRoot: document.getElementById('quiz'),
    cardsRoot: document.getElementById('cards'),
    gameRoot: document.getElementById('game'),
    configPath: 'config/',
    levelsPath: 'content/levels/',
    hooks: account.hooks,
  }).catch((err) => {
    const p = document.getElementById('loading');
    p.hidden = false;
    p.textContent = '群島載入失敗：' + err.message;
  });
</script>
</body>
</html>
