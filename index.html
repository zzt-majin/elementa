<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>故事島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="world/world.css">
<!-- three.js（MIT）固定版本，從 cdnjs 載入 -->
<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.182.0/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="world" aria-label="3D 群島"></canvas>
<div id="hud">
  <header class="top">
    <h1 id="site-title">故事島</h1>
    <div id="kids" class="chips" hidden></div>
    <button id="mute" class="btn ghost small" type="button"></button>
  </header>
  <p id="hint" class="hint"></p>
  <p id="errors" class="errors" hidden></p>
  <aside id="panel" hidden><div id="panel-body"></div></aside>
  <p id="loading" class="loading">群島正在浮出海面…</p>
  <button id="start" class="start" type="button" hidden></button>
</div>
<script type="module">
  import { startWorld } from './world/main.js';
  startWorld({
    canvas: document.getElementById('world'),
    hudRoot: document.getElementById('hud'),
    configPath: 'config/',
    levelsPath: 'content/levels/',
  }).catch((err) => {
    const p = document.getElementById('loading');
    p.hidden = false;
    p.textContent = '群島載入失敗：' + err.message;
  });
</script>
</body>
</html>
